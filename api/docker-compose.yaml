services:
  tomabar_api:
    container_name: tomabar_api
    build: .
    ports:
      - "2118:2118"
    restart: unless-stopped
    environment:
      - METRICS_PATH=/metrics.log
      - HOST=0.0.0.0
    volumes:
      - ${HOME}/Library/Containers/com.github.ivoronin.TomatoBar/Data/Library/Caches/TomatoBar.log:/app/metrics.log:ro
